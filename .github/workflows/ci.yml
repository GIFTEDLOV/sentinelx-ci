name: SentinelX deterministic CI evidence

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character candidate source commit in GIFTEDLOV/sentinelx
        required: true
        type: string
      parent_commit:
        description: Exact 40-character parent source commit in GIFTEDLOV/sentinelx
        required: true
        type: string
      target:
        description: Exact deployed protected target address
        required: true
        type: string
      policy_fingerprint:
        description: Exact registered SentinelX policy fingerprint
        required: true
        type: string
      evidence_id:
        description: Globally unique CI evidence ID
        required: true
        type: string
      published_at:
        description: Explicit evidence publication Unix timestamp
        required: true
        type: string
      expires_at:
        description: Explicit evidence expiry Unix timestamp
        required: true
        type: string

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout candidate source at immutable commit
        uses: actions/checkout@v4
        with:
          repository: GIFTEDLOV/sentinelx
          ref: ${{ inputs.source_commit }}
          path: source

      - name: Checkout parent source at immutable commit
        uses: actions/checkout@v4
        with:
          repository: GIFTEDLOV/sentinelx
          ref: ${{ inputs.parent_commit }}
          path: parent-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact source toolchain
        working-directory: source
        run: python -m pip install -r requirements.txt

      - name: Run fail-closed preflight
        working-directory: source
        run: python scripts/preflight.py

      - name: Run direct tests
        working-directory: source
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/direct -q --tb=short

      - name: Build CI envelope (artifact only)
        working-directory: source
        run: >-
          python scripts/generate_ci_evidence.py
          --target "${{ inputs.target }}"
          --issuer "GIFTEDLOV/sentinelx-ci"
          --evidence-id "${{ inputs.evidence_id }}"
          --parent ../parent-source/contracts/protected_app_v1.py
          --candidate contracts/protected_app_v2_safe.py
          --parent-source-url "https://raw.githubusercontent.com/GIFTEDLOV/sentinelx/${{ inputs.parent_commit }}/contracts/protected_app_v1.py"
          --candidate-source-url "https://raw.githubusercontent.com/GIFTEDLOV/sentinelx/${{ inputs.source_commit }}/contracts/protected_app_v2_safe.py"
          --source-prefix "https://raw.githubusercontent.com/GIFTEDLOV/sentinelx/"
          --ci-prefix "https://raw.githubusercontent.com/GIFTEDLOV/sentinelx-ci/"
          --policy-fingerprint "${{ inputs.policy_fingerprint }}"
          --published-at "${{ inputs.published_at }}"
          --expires-at "${{ inputs.expires_at }}"
          --output ci-evidence.json

      - name: Upload CI evidence for authorized publication review
        uses: actions/upload-artifact@v4
        with:
          name: sentinelx-ci-evidence-${{ inputs.evidence_id }}
          path: source/ci-evidence.json
          if-no-files-found: error
